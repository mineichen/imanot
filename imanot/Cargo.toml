[package]
name = "imanot"
version.workspace = true
edition.workspace = true
description = "Extensible image annotation framework with zoom, pan and pixel selection tools for Desktop and WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui.workspace = true
futures = "0.3"
image-0_25 = { workspace = true, optional = true }
imask.workspace = true
imbuf.workspace = true
itertools.workspace = true
log.workspace = true
nalgebra.workspace = true
num-traits = "0.2"
pulp = "0.22"
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
] }

[features]
default = []

[dev-dependencies]
serde_json = "1"
imanot = { path = ".", features = ["serde"] }
