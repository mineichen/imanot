[package]
name = "imanot"
version.workspace = true
edition.workspace = true
description = "Extensible image annotation framework with zoom, pan and pixel selection tools for Desktop and WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Instances and uniforms as bytes for the GPU, already a dependency of egui_glow / egui-wgpu
bytemuck = { version = "1", features = ["derive"] }
egui.workspace = true
egui_glow = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true, features = [
    # Paint callbacks must be Send + Sync, wgpu types only are on wasm with this
    "fragile-send-sync-non-atomic-wasm",
] }
euclid.workspace = true
fixed.workspace = true
futures = "0.3"
image-0_25 = { workspace = true, optional = true }
imask.workspace = true
imbuf.workspace = true
itertools.workspace = true
log.workspace = true
nalgebra.workspace = true
num-traits = "0.2"
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
] }

[features]
default = []
# GPU backends, see `imanot::gpu`. Enable the one(s) eframe renders with.
glow = ["dep:egui_glow"]
wgpu = ["dep:egui-wgpu"]

[dev-dependencies]
serde_json = "1"
imanot = { path = ".", features = ["serde"] }
